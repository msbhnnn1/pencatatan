<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pengeluaran</title>

  <!-- Google Fonts & Chart.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>💰 Pencatat Pengeluaran</h1>
      <p class="subtitle">Terhubung langsung dengan Telegram Bot</p>
    </header>

    <!-- Stat Cards -->
    <section class="stats-grid">
      <div class="card stat-card">
        <span class="stat-title">Total Pengeluaran Bulan Ini</span>
        <h2 id="totalAmount">Rp 0</h2>
      </div>
      <div class="card stat-card">
        <span class="stat-title">Jumlah Transaksi</span>
        <h2 id="totalCount">0</h2>
      </div>
    </section>

    <!-- Visual Chart & Table Grid -->
    <section class="content-grid">
      <!-- Chart Card -->
      <div class="card chart-card">
        <h3>Pengeluaran per Kategori</h3>
        <div class="chart-container">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>

      <!-- Transactions List Card -->
      <div class="card table-card">
        <div class="table-header">
          <h3>Riwayat Transaksi</h3>
          <button id="refreshBtn">🔄 Refresh Data</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Kategori</th>
                <th>Keterangan</th>
                <th>Nominal</th>
              </tr>
            </thead>
            <tbody id="transactionBody">
              <!-- Data akan diisi via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
